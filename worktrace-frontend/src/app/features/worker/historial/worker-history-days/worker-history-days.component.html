<div class="days-container">
  @for (dia of dias(); track dia.fecha) {
    <div
      class="day-card"
      [class.day-selected]="dia.seleccionado"
      (click)="onSelectDia(dia)"
      (keydown.enter)="onSelectDia(dia)"
      (keydown.space)="onSelectDia(dia)"
      role="button"
      tabindex="0"
      matRipple
    >
      <div class="day-name">{{ dia.nombre }}</div>
      <div class="day-number">{{ dia.numero }}</div>
    </div>
  }
</div>
