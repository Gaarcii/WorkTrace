<div class="page-container">
  <div class="main-content">
    <app-worker-history-header
      [rangoSemana]="rangoSemana()"
      (prevWeek)="semanaAnterior()"
      (nextWeek)="semanaSiguiente()"
      (dateChanged)="onDateChange($event)"
    />

    <app-worker-history-days [dias]="diasSemana()" (diaSeleccionado)="seleccionarDia($event)" />

    <div class="resumen-section">
      <app-worker-history-stats
        titulo="RESUMEN DE LA SEMANA"
        [isWeekly]="true"
        [horas]="estadisticasSemana().horas"
        [balance]="estadisticasSemana().balance"
        [isPositive]="estadisticasSemana().isPositive"
      />

      <app-worker-history-stats
        titulo="RESUMEN DEL DÍA"
        [isWeekly]="false"
        [horas]="estadisticasDia().horas"
        [balance]="estadisticasDia().balance"
        [isPositive]="estadisticasDia().isPositive"
      />

      <app-worker-history-records [registros]="fichajesDelDia()" />
    </div>
  </div>
</div>
