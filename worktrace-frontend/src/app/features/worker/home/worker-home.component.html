<div class="page-container">
  <div class="main-content">
    @if (errorMsg()) {
      <app-error-alert [message]="errorMsg()!" (closed)="clearError()" />
    }

    <app-worker-status-card
      [badgeClass]="estadoBadgeClass()"
      [dotClass]="estadoDotClass()"
      [texto]="estadoTexto()"
      [hora]="horaActual()"
      [fecha]="fechaActual()"
    />

    <app-worker-action-card
      [isLoading]="isLoading()"
      [texto]="botonTexto()"
      [subtexto]="botonSubtexto()"
      (actionClicked)="handleFichaje()"
    />

    <div class="resumen-section">
      <div class="resumen-title">RESUMEN DEL DÍA</div>

      <app-worker-summary-stats
        [horasTrabajadas]="horasTrabajadas()"
        [horasExtras]="horasExtras()"
        [isHorasExtrasPositivo]="isHorasExtrasPositivo()"
      />

      <div class="resumen-title registros-title">REGISTROS RECIENTES</div>

      <app-worker-recent-records [registros]="registrosFormateados()" />
    </div>
  </div>
</div>
