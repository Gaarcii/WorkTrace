<div class="page-container">
  <div class="main-content">
    <div class="page-header">
      <h1 class="page-title">Mi Perfil</h1>
      <p class="page-subtitle">Gestiona tu información personal y revisa tu jornada</p>
    </div>

    <div class="top-grid">
      <div class="left-panel">
        <app-worker-perfil-identity
          [avatarUrl]="profile()?.avatarUrl"
          [nombreCompleto]="profile()?.nombreCompleto"
          [puestoTrabajo]="profile()?.puestoTrabajo"
          (editAvatar)="abrirSelectorAvatar()"
        />
      </div>

      <div class="right-panel">
        <app-worker-perfil-contact [form]="form" [loading]="loading()" (save)="guardarPerfil()" />

        <app-worker-perfil-security (changePassword)="abrirModalPassword()" />
      </div>
    </div>

    <app-worker-perfil-schedule [horario]="horarioSemanal()" [loading]="loading()" />
  </div>

  @if (mostrarConfirmacion()) {
    <div class="snackbar-success">Operación realizada correctamente</div>
  }
  @if (mostrarError()) {
    <div class="snackbar-error">{{ errorMessage() }}</div>
  }
</div>

@if (mostrarPedirPasswordEmail()) {
  <app-worker-perfil-email-modal
    [passwordControl]="passwordConfirmacion"
    [loading]="loading()"
    (close)="cerrarModalPasswordEmail()"
    (confirm)="confirmarGuardarConPassword()"
  />
}

@if (mostrarSelectorAvatar()) {
  <app-worker-perfil-avatar-modal
    [avatarUrl]="profile()?.avatarUrl"
    [avatarPreview]="avatarPreview()"
    [loading]="loading()"
    (close)="cerrarSelectorAvatar()"
    (fileSelected)="procesarArchivo($event)"
    (delete)="eliminarFoto()"
    (save)="guardarPerfil()"
  />
}

@if (mostrarCambiarPassword()) {
  <app-worker-perfil-password-modal
    [passwordForm]="passwordForm"
    [passwordError]="passwordError()"
    [loading]="loadingPassword()"
    (close)="cerrarModalPassword()"
    (save)="actualizarPassword()"
  />
}
