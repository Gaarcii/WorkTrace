<div class="filtro-fechas-card card-surface">
  <form [formGroup]="form()" (ngSubmit)="onSubmit()" class="filtro-fechas-container">
    <div class="fechas-inputs">
      <div class="input-group">
        <label for="fechaInicio">Fecha inicio</label>
        <input
          id="fechaInicio"
          type="date"
          formControlName="fechaInicio"
          class="native-date-input"
        />
      </div>
      <div class="input-group">
        <label for="fechaFin">Fecha fin</label>
        <input id="fechaFin" type="date" formControlName="fechaFin" class="native-date-input" />
      </div>
    </div>
    <button
      mat-flat-button
      color="primary"
      type="submit"
      [disabled]="form().invalid"
      class="aplicar-filtro-btn"
    >
      Aplicar
    </button>
  </form>
</div>
