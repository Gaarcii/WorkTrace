<div class="page-container">
  <div class="main-content">
    <app-worker-estadisticas-header
      [periodoSeleccionado]="periodoSeleccionado()"
      [mostrarFiltroFechas]="mostrarFiltroFechas()"
      (toggleFiltro)="toggleFiltro()"
      (cambiarPeriodo)="cambiarPeriodo($event)"
    />

    @if (mostrarFiltroFechas()) {
      <app-worker-estadisticas-filter
        [form]="filterForm"
        (aplicar)="aplicarFiltroPersonalizado()"
      />
    }

    <app-worker-estadisticas-summary
      [horasTrabajadas]="horasTrabajadas()"
      [balanceHorario]="balanceHorario()"
      [balanceClass]="balanceClass()"
      [jornadasIncompletas]="jornadasIncompletas()"
      [totalIncidencias]="totalIncidencias()"
    />

    <app-worker-estadisticas-chart
      [semanaVisible]="semanaVisible()"
      [totalSemanas]="historialPaginado().length"
      [currentWeekIndex]="currentWeekIndex()"
      (prevWeek)="prevWeek()"
      (nextWeek)="nextWeek()"
      (diaSeleccionado)="mostrarTooltip($event)"
    />

    <app-worker-estadisticas-balance
      [balanceHorario]="balanceHorario()"
      [balanceClass]="balanceClass()"
    />

    <app-worker-estadisticas-days
      [resumenDias]="semanaVisible()?.resumenDias"
      (verDetalleDia)="verDetalleDia($event)"
    />

    @if (incidenciasPeriodo().length > 0) {
      <app-worker-estadisticas-incidences [incidencias]="incidenciasPeriodo()" />
    }

    <app-worker-estadisticas-actions
      [isDownloadingPdf]="isDownloadingPdf()"
      (descargarRegistros)="descargarRegistros()"
      (verHistorialDetallado)="verHistorialDetallado()"
    />
  </div>
</div>
