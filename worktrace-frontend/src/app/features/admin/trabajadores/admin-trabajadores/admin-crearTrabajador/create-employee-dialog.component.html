@if (modelValue()) {
  <div class="dialog-backdrop" (click)="close.emit()">
    <div class="dialog-card" (click)="$event.stopPropagation()">
      <div class="dialog-title">
        Nuevo Empleado
      </div>

      <div class="dialog-content">
        <div class="field-grid">
          <div class="field-group">
            <label for="employee-fullName">Nombre completo</label>
            <input
              id="employee-fullName"
              class="form-control"
              type="text"
              placeholder="Introduce el nombre completo"
              [ngModel]="formData().fullName"
              (ngModelChange)="onFullNameChange($event)"
            />
          </div>

          <div class="field-group">
            <label for="employee-code">DNI</label>
            <input
              id="employee-code"
              class="form-control"
              type="text"
              placeholder="Introduce DNI"
              [ngModel]="formData().employeeCode"
              (ngModelChange)="onEmployeeCodeChange($event)"
            />
          </div>

          <div class="field-group">
            <label for="employee-email">Email</label>
            <input
              id="employee-email"
              class="form-control"
              placeholder="nombre@empresa.com"
              [ngModel]="formData().email"
              (ngModelChange)="onEmailChange($event)"
              type="email"
            />
          </div>

          <div class="field-group">
            <label for="employee-phone">Teléfono</label>
            <input
              id="employee-phone"
              class="form-control"
              type="text"
              placeholder="Introduce teléfono"
              [ngModel]="formData().phone"
              (ngModelChange)="onPhoneChange($event)"
            />
          </div>

          <div class="field-group">
            <label for="employee-hours">Horas semanales</label>
            <input
              id="employee-hours"
              class="form-control"
              placeholder="Ejemplo: 40"
              [ngModel]="formData().weeklyHours"
              (ngModelChange)="onWeeklyHoursChange($event)"
              type="number"
              min="1"
              max="168"
              step="0.5"
            />
          </div>

          <div class="field-group">
            <label for="employee-position">Puesto</label>
            <select
              id="employee-position"
              class="form-control"
              [ngModel]="formData().positionId"
              (ngModelChange)="onPositionChange($event)"
            >
              <option [ngValue]="null">Selecciona un puesto</option>
              @for (puesto of puestosTrabajo(); track puesto.id) {
                <option [ngValue]="puesto.id">{{ puesto.title }}</option>
              }
            </select>
          </div>
        </div>

        <button type="button" class="btn-link" (click)="openJobPositions.emit()">
          Gestionar puestos de trabajo
        </button>
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn btn-outlined" (click)="close.emit()">CANCELAR</button>
        <button
          type="button"
          class="btn btn-primary"
          [disabled]="loading()"
          (click)="submit.emit()"
        >
          {{ loading() ? 'GUARDANDO...' : 'CREAR EMPLEADO' }}
        </button>
      </div>
    </div>
  </div>
}
