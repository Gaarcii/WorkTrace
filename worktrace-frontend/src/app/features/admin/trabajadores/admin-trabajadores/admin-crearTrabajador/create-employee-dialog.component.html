@if (modelValue()) {
  <div class="dialog-backdrop" (click)="close.emit()">
    <div class="dialog-card mat-elevation-z24" (click)="$event.stopPropagation()">
      <div class="dialog-title">
        <mat-icon class="mr-2">person_add</mat-icon>
        Nuevo Empleado
      </div>

      <div class="dialog-content">
        <div class="field-grid">
          <mat-form-field appearance="outline">
            <mat-label>Nombre completo</mat-label>
            <input
              matInput
              [ngModel]="formData().fullName"
              (ngModelChange)="onFullNameChange($event)"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>DNI / Código</mat-label>
            <input
              matInput
              [ngModel]="formData().employeeCode"
              (ngModelChange)="onEmployeeCodeChange($event)"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Email</mat-label>
            <input
              matInput
              [ngModel]="formData().email"
              (ngModelChange)="onEmailChange($event)"
              type="email"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Teléfono</mat-label>
            <input matInput [ngModel]="formData().phone" (ngModelChange)="onPhoneChange($event)" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Horas semanales</mat-label>
            <input
              matInput
              [ngModel]="formData().weeklyHours"
              (ngModelChange)="onWeeklyHoursChange($event)"
              type="number"
              min="1"
              max="168"
              step="0.5"
            />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Puesto</mat-label>
            <mat-select
              [ngModel]="formData().positionId"
              (ngModelChange)="onPositionChange($event)"
            >
              <mat-option [value]="null">Selecciona un puesto</mat-option>
              @for (puesto of puestosTrabajo(); track puesto.id) {
                <mat-option [value]="puesto.id">{{ puesto.title }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        </div>

        <button mat-button color="primary" class="btn-link" (click)="openJobPositions.emit()">
          Gestionar puestos de trabajo
        </button>
      </div>

      <div class="dialog-actions">
        <button mat-button (click)="close.emit()">CANCELAR</button>
        <button mat-flat-button color="primary" [disabled]="loading()" (click)="submit.emit()">
          {{ loading() ? 'GUARDANDO...' : 'CREAR EMPLEADO' }}
        </button>
      </div>
    </div>
  </div>
}
