@if (modelValue) {
  <div class="dialog-backdrop" (click)="modelValueChange.emit(false)">
    <div class="dialog-card small" (click)="$event.stopPropagation()">
      <div class="dialog-title error text-white">
        <i class="mdi mdi-alert mr-2"></i>
        Confirmar eliminación
      </div>
      <div class="dialog-content">
        ¿Estás seguro de que deseas eliminar el puesto
        <strong>"{{ puestoABorrar?.title }}"</strong>?
      </div>
      <div class="dialog-actions">
        <button type="button" class="btn-text" (click)="cancel.emit()">Cancelar</button>
        <button type="button" class="btn-danger" (click)="confirm.emit()" [disabled]="loading">
          {{ loading ? 'Eliminando...' : 'Eliminar' }}
        </button>
      </div>
    </div>
  </div>
}
