<div class="day-row-card">
  <form [formGroup]="scheduleForm">
    <div class="day-grid">
      <div class="day-toggle">
        <label class="switch" aria-label="Activar dia">
          <input
            type="checkbox"
            [checked]="scheduleForm.controls.isActive.value"
            (change)="onActiveChanged($event)"
          />
          <span class="slider"></span>
        </label>
        <span class="day-name">{{ dayName() }}</span>
      </div>

      <div class="field">
        <label for="siteId">Centro de trabajo</label>
        <select id="siteId" formControlName="siteId" (change)="onFieldChanged()">
          <option value="">Selecciona un centro</option>
          @for (site of workSites(); track site.id) {
            <option [value]="site.id">{{ site.name }}</option>
          }
        </select>
      </div>

      <div class="field">
        <label for="startTime">Inicio</label>
        <input id="startTime" type="time" formControlName="startTime" (input)="onFieldChanged()" />
      </div>

      <div class="field">
        <label for="endTime">Fin</label>
        <input id="endTime" type="time" formControlName="endTime" (input)="onFieldChanged()" />
      </div>

      <div class="field field-copy">
        <button
          type="button"
          class="copy-btn"
          [disabled]="!scheduleForm.controls.isActive.value || !isConfigComplete()"
          (click)="onCopyToAll()"
          title="Copiar configuracion a toda la semana"
        >
          <span class="material-icons">content_copy</span>
        </button>
      </div>
    </div>

    @if (scheduleForm.controls.isActive.value && !isConfigComplete()) {
      <div class="row-warning">Completa centro, hora de inicio y hora de fin para este dia.</div>
    }
  </form>
</div>
