<div>
  <div class="d-flex justify-space-between align-center mb-3">
    <h3 class="text-subtitle-2 text-grey-darken-1 font-weight-medium">Fichajes por Día</h3>
    <div class="nav-buttons">
      <button class="nav-btn" type="button" (click)="emitPrev()">
        <span class="material-icons">chevron_left</span>
      </button>
      <button class="nav-btn" type="button" (click)="emitOpen()">
        <span class="material-icons">calendar_month</span>
      </button>
      <button class="nav-btn" type="button" (click)="emitNext()">
        <span class="material-icons">chevron_right</span>
      </button>
    </div>
    <ng-content select="[date-input]"></ng-content>
  </div>

  <div class="stat-card mb-6 pa-6">
    <div class="text-subtitle-2 font-weight-bold text-center mb-8">
      {{ rangoSemana() }}
    </div>
    <div class="chart-container">
      <div class="chart-bars">
        @for (dia of fichajesSemana(); track dia.workDate) {
          <div class="chart-bar-wrapper" (click)="emitSelectDay(dia)">
            <div
              class="chart-bar"
              [class.chart-bar-active]="dia.seleccionado"
              [style.height.%]="dia.porcentaje"
            >
              <div class="chart-tooltip">{{ dia.valor }}</div>
            </div>
          </div>
        }
      </div>
      <div class="chart-labels">
        @for (dia of fichajesSemana(); track dia.workDate) {
          <span class="chart-label" [class.chart-label-active]="dia.seleccionado">
            {{ dia.dia }}
          </span>
        }
      </div>
    </div>
    <div class="d-flex align-center justify-center mt-4 text-caption text-grey">
      <div class="legend-box"></div>
      <span>{{ leyendaGrafico() }}</span>
    </div>
  </div>
</div>
