<div>
  <div class="d-flex justify-space-between align-center mb-3">
    <h3 class="text-subtitle-2 text-grey-darken-1 font-weight-medium">Por Departamento</h3>

    <div class="select-wrapper">
      <select class="department-select text-caption" (change)="onFilterChange($event)">
        <option value="ALL" [selected]="!departamentoSeleccionado()">Todos</option>
        @for (dept of departamentos(); track dept.nombre) {
          <option [value]="dept.nombre" [selected]="departamentoSeleccionado() === dept.nombre">
            {{ dept.nombre }}
          </option>
        }
      </select>
      <span class="material-icons select-icon">expand_more</span>
    </div>
  </div>

  <div class="stat-card mb-6 pa-4">
    @for (dept of departamentosFiltrados(); track dept.nombre) {
      <div class="mb-4" [class.opacity-50]="!dept.activo">
        <div class="d-flex justify-space-between text-body-2 mb-1">
          <span class="font-weight-medium">{{ dept.nombre }}</span>
          <span class="font-weight-medium">{{ dept.activos }}/{{ dept.total }}</span>
        </div>
        <div class="progress-bar-bg">
          <div class="progress-bar-fill" [style.width.%]="dept.porcentaje"></div>
        </div>
        @if (dept.horas) {
          <div class="text-caption text-grey mt-1">{{ dept.horas }}h trabajadas</div>
        }
      </div>
    }
  </div>
</div>
