<div class="general-settings">
  <div class="settings-card fade-in">
    <div class="section-header">
      <div class="header-content">
        <h3 class="section-title">Información General</h3>
        <p class="section-subtitle">Configuración básica de tu empresa</p>
      </div>
    </div>

    @if (isLoading()) {
      <div class="loading-container">
        <div class="spinner" aria-hidden="true"></div>
        <p class="loading-text">Cargando configuración...</p>
      </div>
    }

    @if (loadError()) {
      <div class="alert-error">
        <span class="material-icons">error_outline</span>
        <span>{{ loadError() }}</span>
      </div>
    }

    @if (!isLoading()) {
      <form class="company-form" (submit)="$event.preventDefault(); onSave()">
        <div class="form-grid">
          <div class="field-group">
            <label for="company-name" class="field-label">Nombre de la empresa</label>
            <div class="input-wrapper">
              <span class="material-icons input-icon">business</span>
              <input
                id="company-name"
                class="modern-input"
                type="text"
                [value]="formData().name"
                (input)="onCompanyNameChange($any($event.target).value)"
                [disabled]="isSaving()"
                required
              />
              <div class="focus-border"></div>
            </div>
          </div>

          <div class="field-group">
            <label for="company-cif" class="field-label">CIF / NIF</label>
            <div class="input-wrapper">
              <span class="material-icons input-icon">badge</span>
              <input
                id="company-cif"
                class="modern-input"
                type="text"
                [value]="formData().cif"
                (input)="onCifChange($any($event.target).value)"
                [disabled]="isSaving()"
              />
              <div class="focus-border"></div>
            </div>
          </div>
        </div>

        <div class="divider"></div>

        <div class="logo-section">
          <label class="field-label" for="company-logo">Logotipo Corporativo</label>

          <div class="logo-grid">
            @if (logoPreview()) {
              <div class="logo-preview-card">
                <div class="logo-checker-bg">
                  <img [src]="logoPreview()" alt="Logo de la empresa" class="logo-preview-img" />
                </div>
              </div>
            }

            <div class="file-upload-wrapper" [class.is-disabled]="isSaving()">
              <input
                id="company-logo"
                type="file"
                class="hidden-file-input"
                accept="image/*"
                [disabled]="isSaving()"
                (change)="onFileChange($event)"
              />
              <label for="company-logo" class="file-dropzone">
                <div class="dropzone-content">
                  <span class="material-icons upload-icon">cloud_upload</span>
                  <span class="upload-title">Subir nueva imagen</span>
                  <span class="hint">PNG, JPG o SVG (Máx. 2MB)</span>
                </div>
              </label>
            </div>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn-primary" [disabled]="isSaving()">
            @if (isSaving()) {
              <span class="btn-spinner"></span>
              <span>Guardando...</span>
            } @else {
              <span class="material-icons">save</span>
              <span>Guardar Cambios</span>
            }
          </button>
        </div>
      </form>
    }
  </div>
</div>
