<mat-card class="filter-card mb-4">
  <form [formGroup]="filterForm()" class="filters-grid">
    <div class="native-filter">
      <label for="action">Tipo de Acción</label>
      <select id="action" formControlName="action">
        @for (option of actionOptions(); track $index) {
          <option [value]="option.value">{{ option.title }}</option>
        }
      </select>
    </div>

    <div class="native-filter">
      <label for="startDate">Fecha Inicio</label>
      <input id="startDate" type="date" formControlName="startDate" />
    </div>

    <div class="native-filter">
      <label for="endDate">Fecha Fin</label>
      <input id="endDate" type="date" formControlName="endDate" />
    </div>

    <div class="filter-actions">
      <button
        type="button"
        class="btn-clear"
        (click)="clear.emit()"
        [disabled]="
          !filterForm().value.action && !filterForm().value.startDate && !filterForm().value.endDate
        "
      >
        Limpiar Filtros
      </button>
    </div>
  </form>
</mat-card>
