<mat-card class="search-card">
  <mat-form-field appearance="outline" class="w-100 no-bottom-space">
    <mat-icon matPrefix class="text-grey">search</mat-icon>
    <input matInput [formControl]="searchControl()" placeholder="Buscar empleados..." />
    @if (searchControl().value) {
      <button matSuffix mat-icon-button (click)="searchControl().setValue('')">
        <mat-icon>close</mat-icon>
      </button>
    }
  </mat-form-field>
</mat-card>
