<div class="dashboard-container">
  <app-inspector-header />

  @if (error()) {
    <app-inspector-alert [error]="error()!" (onRetry)="retry()" (onClear)="clearError()" />
  }

  @if (loading()) {
    <div class="loading-wrapper">
      <mat-spinner diameter="48" color="primary"></mat-spinner>
      <p class="loading-text">Sincronizando datos en tiempo real...</p>
    </div>
  } @else if (stats(); as currentStats) {
    <app-inspector-stats-grid [stats]="currentStats" />

    <div class="export-widget-wrapper">
      <app-inspector-export-card [isExporting]="isExporting()" (export)="handleExport($event)" />
    </div>

    <app-inspector-info-grid />
  }
</div>
