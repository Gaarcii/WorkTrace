<mat-card class="filter-card">
  <div class="filters-grid">
    <div class="filter-field">
      <label for="estado">Estado</label>
      <div class="input-wrapper clickable" (click)="estadoSelect.focus()">
        <select #estadoSelect id="estado" [formControl]="statusControl()" class="form-control">
          <option value="" disabled>Selecciona un estado</option>
          @for (option of statusOptions(); track option.value) {
            <option [value]="option.value">{{ option.text }}</option>
          }
        </select>
        <mat-icon class="input-icon">expand_more</mat-icon>
        @if (statusControl().value) {
          <button
            type="button"
            class="clear-button"
            (click)="$event.stopPropagation(); statusControl().setValue('')"
            aria-label="Limpiar estado"
          >
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>
    </div>

    <div class="filter-field">
      <label for="tipo">Tipo</label>
      <div class="input-wrapper clickable" (click)="tipoSelect.focus()">
        <select #tipoSelect id="tipo" [formControl]="typeControl()" class="form-control">
          <option value="" disabled>Selecciona un tipo</option>
          @for (tipo of tipos(); track tipo.id) {
            <option [value]="tipo.id">{{ tipo.name }}</option>
          }
        </select>
        <mat-icon class="input-icon">expand_more</mat-icon>
        @if (typeControl().value) {
          <button
            type="button"
            class="clear-button"
            (click)="$event.stopPropagation(); typeControl().setValue('')"
            aria-label="Limpiar tipo"
          >
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>
    </div>

    <div class="filter-field">
      <label for="busqueda">Buscar</label>
      <div class="input-wrapper clickable" (click)="searchInput.focus()">
        <span class="input-leading-icon">
          <mat-icon>search</mat-icon>
        </span>
        <input
          #searchInput
          id="busqueda"
          type="text"
          [formControl]="searchControl()"
          class="form-control"
          placeholder="Buscar por empleado..."
        />
        @if (searchControl().value) {
          <button
            type="button"
            class="clear-button"
            (click)="$event.stopPropagation(); searchControl().setValue('')"
            aria-label="Limpiar búsqueda"
          >
            <mat-icon>close</mat-icon>
          </button>
        }
      </div>
    </div>
  </div>
</mat-card>
