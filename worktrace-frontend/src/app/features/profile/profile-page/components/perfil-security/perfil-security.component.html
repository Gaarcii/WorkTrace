<div class="card-surface">
  <div class="card-title"><mat-icon class="text-primary mr-2">security</mat-icon> Seguridad</div>
  <div class="security-row">
    <div class="security-info">
      <h3>Contraseña de acceso</h3>
      <p>Actualiza tu contraseña periódicamente para mantener tu cuenta segura.</p>
    </div>
    <button mat-stroked-button color="primary" class="pass-btn" (click)="onChange()">
      Cambiar contraseña
    </button>
  </div>
</div>
