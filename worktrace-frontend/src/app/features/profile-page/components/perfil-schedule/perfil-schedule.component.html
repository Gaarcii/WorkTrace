<div class="horario-semanal-section mt-5">
  <h2 class="section-title text-center mb-4">Horario semanal</h2>

  @if (loading()) {
    <div class="loading-state py-4"><mat-spinner diameter="40"></mat-spinner></div>
  } @else {
    <div class="week-grid-wrapper">
      <div class="week-grid">
        @for (dia of horario(); track dia.id) {
          <div class="day-col" [class.is-free]="!dia.work">
            <div class="day-header">{{ dia.initial }}</div>

            @if (dia.work) {
              <div class="day-body">
                <div class="day-lugar">{{ dia.place }}</div>
                @if (dia.location) {
                  <div class="day-address">{{ dia.location }}</div>
                }
                <div class="day-time-badge">
                  <mat-icon class="time-icon">schedule</mat-icon>
                  {{ dia.start }} - {{ dia.end }}
                </div>
              </div>
            } @else {
              <div class="day-body free">Libre</div>
            }
          </div>
        }
      </div>
    </div>
  }
</div>
