@if (showHeader()) {
  <app-header-bar />

  @if (userRole() === 'ROLE_WORKER' || userRole() === 'WORKER') {
    <app-worker-bottom-nav />
  }

  @if (userRole() === 'ROLE_ADMIN' || userRole() === 'ADMIN') {
    <app-admin-navbar />
  }

  @if (userRole() === 'ROLE_INSPECTOR' || userRole() === 'INSPECTOR') {
    <app-inspector-bottom-nav />
  }
}

<main [class.layout-with-nav]="showHeader()">
  <router-outlet />
</main>
