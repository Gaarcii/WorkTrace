map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# 1. Redirigir todo el tráfico HTTP (puerto 80) a HTTPS
server {
    listen 80;
    server_name worktrace.dev www.worktrace.dev;
    return 301 https://$host$request_uri;
}

# 2. Servidor seguro HTTPS (puerto 443)
server {
    listen 443 ssl;
    server_name worktrace.dev www.worktrace.dev;

    # Rutas a tus certificados generados con Certbot
    ssl_certificate /etc/letsencrypt/live/worktrace.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/worktrace.dev/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # Regla SPA para Angular
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Caché estática
    location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # HTML principal sin caché
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # API proxy hacia Spring Boot
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}