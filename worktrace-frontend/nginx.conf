map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
# Servidor Nginx para servir la SPA Angular en produccion.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Regla SPA: Angular gestiona las rutas y evita 404 al recargar.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache eficiente para recursos estaticos versionados por hash.
   location ~* \.(?:css|js|mjs|map|ico|png|jpg|jpeg|gif|svg|webp|avif|woff|woff2|ttf|eot)$ {
     expires 1y;
     add_header Cache-Control "public, immutable";
     try_files $uri =404;
    }

    # El HTML principal no se cachea para publicar nuevas versiones.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # API proxy — enruta llamadas `/api/...` al servicio `backend` en la red de Docker
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
