services:
  frontend:
    build:
      context: ./worktrace-frontend
      dockerfile: Dockerfile
    image: worktrace-frontend:prod
    restart: unless-stopped
    env_file: .env
    depends_on:
      - backend
    networks:
      - worktrace-network
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro

  backend:
    build:
      context: ./worktrace-backend
      dockerfile: Dockerfile
    image: worktrace-backend:prod
    restart: unless-stopped
    env_file: .env
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/${DB_NAME}
      - SPRING_DATASOURCE_USERNAME=${DB_USER}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD}
      - SPRING_PROFILES_ACTIVE=prod
    depends_on:
      - db
    networks:
      - worktrace-network
    expose:
      - "8080"

  db:
    image: postgis/postgis:16-3.4
    container_name: postgres_work_trace
    restart: unless-stopped
    env_file: .env
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    networks:
      - worktrace-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME} -h localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  worktrace-network:
    driver: bridge

volumes:
  postgres-data:
    name: worktrace_postgres_data
